<title>Arrow Business Records</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger workspace. Top bar with logo, sector tabs, a left file shelf, one page on the desk, Arrow command bar docked at the bottom. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --sunk:#E8EEF2; --line:#D3DDE4;
  --fg:#12233D; --muted:#5A6B7E; --navy:#13294B; --teal:#1C6E8C; --teal-soft:#DCEDF3;
  --gold:#B8901F; --good:#1E7A4C; --bad:#B23A3A; --onaccent:#FFFFFF;
  --display:"Sora",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1726; --surface:#14223A; --sunk:#0F1B2E; --line:#263A57;
  --fg:#E4ECF5; --muted:#93A6BC; --navy:#9CC4E8; --teal:#4FB3D3; --teal-soft:#16354A;
  --gold:#E0BD55; --good:#5CC68F; --bad:#EE7B7B; --onaccent:#08121F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1726; --surface:#14223A; --sunk:#0F1B2E; --line:#263A57;
  --fg:#E4ECF5; --muted:#93A6BC; --navy:#9CC4E8; --teal:#4FB3D3; --teal-soft:#16354A;
  --gold:#E0BD55; --good:#5CC68F; --bad:#EE7B7B; --onaccent:#08121F; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;color:var(--navy)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--onaccent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px;width:100%}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:16px}
.login-card img{width:150px;height:150px;border-radius:50%;justify-self:center;background:#fff}
.login-card h1{font-size:22px;text-align:center}
.login-card p{margin:0;text-align:center}
.msg{font-size:14px;padding:9px 12px;border-radius:var(--r);background:var(--teal-soft)}
.msg.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.linkish{background:none;border:0;color:var(--teal);padding:0;text-decoration:underline;font-size:13px}

/* ---------- App shell ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:.06em;color:var(--navy)}
.brand span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:none;padding:7px 12px;border-radius:var(--r);color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--teal-soft);color:var(--teal)}
.main{overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .v{font-family:var(--display);font-size:26px;color:var(--navy)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.list{display:grid;gap:2px}
.row{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:6px;min-width:0}
.row:hover{background:var(--sunk)}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.words{background:var(--teal-soft);color:var(--teal)}
.pill.calc{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.pill.locked{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.open{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}

/* records workspace */
.work{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media (max-width:800px){.work{grid-template-columns:1fr}}
.shelf{display:grid;gap:12px}
.seg{display:flex;background:var(--sunk);border-radius:var(--r);padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:6px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filebtn{display:grid;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;width:100%}
.filebtn:hover{background:var(--sunk)}
.filebtn[aria-current="true"]{background:var(--teal-soft)}
.filebtn small{color:var(--muted);font-size:12px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:28px 32px;min-height:520px;display:grid;gap:16px;align-content:start;box-shadow:0 1px 0 var(--line),0 6px 0 -3px var(--surface),0 6px 0 -2px var(--line);min-width:0}
@media (max-width:560px){.sheet{padding:18px 16px}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px}
.sheet-head h2{font-size:22px}
.pager{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pagetabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.pagetab{border:1px solid var(--line);background:var(--sunk);padding:4px 10px;border-radius:6px 6px 0 0;font-size:13px;white-space:nowrap}
.pagetab[aria-current="true"]{background:var(--surface);border-bottom-color:var(--surface);color:var(--teal);font-weight:600}
textarea.content{min-height:340px;resize:vertical;line-height:1.7;border-style:dashed}
.ledger{width:100%;border-collapse:collapse}
.ledger th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px}
.ledger td{border-bottom:1px solid var(--line);padding:4px 6px}
.ledger td input,.ledger td select{border-color:transparent;background:transparent;padding:6px}
.ledger td input:hover,.ledger td select:hover,.ledger td input:focus{border-color:var(--line)}
.ledger .amt input{text-align:right;font-family:var(--mono)}
.ledger tfoot td{font-weight:600;border-bottom:0;padding-top:10px}
.totals{display:flex;flex-wrap:wrap;gap:8px}
.totals .t{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.chartbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px}
.chartbox canvas{max-width:100%}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:48px 16px;color:var(--muted)}

/* upload */
.drop{border:2px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.preview img{max-height:320px;border-radius:6px}

/* command bar */
.cmd{background:var(--navy);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cmd{background:#091220}}
:root[data-theme="dark"] .cmd{background:#091220}
.cmd-inner{max-width:1180px;margin:0 auto;display:grid;gap:6px}
.cmd form{display:flex;gap:8px}
.cmd input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--r);padding:10px 12px}
.cmd input::placeholder{color:rgba(255,255,255,.6)}
.cmd .go{background:#fff;color:#13294B;border:0;border-radius:var(--r);padding:0 16px;font-weight:600}
.cmd .mic{width:44px;border-radius:var(--r);border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;display:grid;place-items:center}
.cmd .mic.on{background:#B23A3A;border-color:#B23A3A}
.cmd .reply{font-size:13px;color:rgba(255,255,255,.85);min-height:1.5em}
.cmd .reply b{color:#E0BD55;font-weight:600}
.cmd .tag{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:#E0BD55}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,12,22,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:12px;padding:22px;width:min(420px,100%);display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:14px;z-index:60}
table.admin{width:100%;border-collapse:collapse;font-size:14px}
table.admin th,table.admin td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" hidden></div>
<div id="modal-root"></div>

const STORE_KEY="arrow.v1";
/* ---------------- storage ---------------- */
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{businesses:{},admin:null}}catch(e){return {businesses:{},admin:null}}}
let DB=load();
let memoryOnly=false;
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB))}catch(e){if(!memoryOnly){memoryOnly=true;toast("Couldn't save to this browser. Changes last until you close the page.")}}}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const now=()=>new Date().toISOString();
const fmtDate=s=>new Date(s).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtDay=s=>new Date(s).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const money=n=>(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=n=>n.trim().toLowerCase();

/* passwords are stored as salted SHA-256 hashes, never as plain text */
async function hash(pw,salt){
  const data=new TextEncoder().encode(salt+":"+pw);
  if(crypto?.subtle){const b=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=0;for(const c of data)h=(h*31+c)|0;return "x"+h;
}

/* ---------------- state ---------------- */
let S={biz:null,view:"dashboard",sector:"words",fileId:null,pageIdx:0,admin:false,charts:[]};
const biz=()=>DB.businesses[S.biz];
const curFile=()=>biz()?.files.find(f=>f.id===S.fileId);
const curPage=()=>curFile()?.pages[S.pageIdx];

/* ---------------- login ---------------- */
function renderLogin(message,isErr){
  document.getElementById("app").hidden=true;
  const el=document.getElementById("login");el.hidden=false;
  el.innerHTML=`<form class="login-card" id="loginForm" autocomplete="off">
    <img src="${LOGO}" alt="Arrow logo">
    <h1>Business records, kept straight</h1>
    <p class="muted">New here? Type a business name and password and tap Open. Your dashboard is created for you. Coming back? Use the same name and password.</p>
    ${message?`<div class="msg ${isErr?"err":""}">${esc(message)}</div>`:""}
    <label class="f">Business name<input type="text" id="lgName" required maxlength="60"></label>
    <label class="f">Password<input type="password" id="lgPw" required minlength="4"></label>
    <button class="btn primary" type="submit">Open</button>
    <button class="linkish" type="button" id="adminLink">Admin sign-in</button>
  </form>`;
  document.getElementById("loginForm").onsubmit=async e=>{
    e.preventDefault();
    const name=document.getElementById("lgName").value.trim(),pw=document.getElementById("lgPw").value;
    if(!name||pw.length<4)return renderLogin("Enter a business name and a password of at least 4 characters.",true);
    const k=key(name);let b=DB.businesses[k];
    if(!b){
      const salt=uid();
      b=DB.businesses[k]={name,salt,hash:await hash(pw,salt),locked:false,created:now(),files:[]};
      seedSample(b);persist();S.biz=k;toast("Business created. Welcome to your dashboard.");
    }else{
      if(await hash(pw,b.salt)!==b.hash)return renderLogin("That password doesn't match this business. Try again, or ask the admin to reset it.",true);
      if(b.locked)return renderLogin("Business locked. Contact the Arrow admin to unlock it.",true);
      S.biz=k;
    }
    S.admin=false;S.view="dashboard";S.fileId=null;renderApp();
  };
  document.getElementById("adminLink").onclick=renderAdminLogin;
}
function renderAdminLogin(message,isErr){
  const first=!DB.admin;
  const el=document.getElementById("login");
  el.innerHTML=`<form class="login-card" id="adForm" autocomplete="off">
    <img src="${LOGO}" alt="Arrow logo">
    <h1>${first?"Set up the admin account":"Admin sign-in"}</h1>
    <p class="muted">${first?"Choose the admin password. Only the admin can lock businesses and reset their passwords.":"Sign in to manage registered businesses."}</p>
    ${typeof message==="string"?`<div class="msg ${isErr?"err":""}">${esc(message)}</div>`:""}
    <label class="f">Admin password<input type="password" id="adPw" required minlength="8"></label>
    ${first?`<label class="f">Confirm password<input type="password" id="adPw2" required minlength="8"></label>`:""}
    <button class="btn primary" type="submit">${first?"Create admin":"Sign in"}</button>
    <button class="linkish" type="button" id="backLink">Back to business sign-in</button>
  </form>`;
  document.getElementById("backLink").onclick=()=>renderLogin();

function bindUpload(){
  const d=document.getElementById("drop");
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=async e=>{e.preventDefault();d.classList.remove("over");const files=[];
    const items=[...e.dataTransfer.items||[]];
    if(items.length&&items[0].webkitGetAsEntry){for(const it of items){const en=it.webkitGetAsEntry();if(en)await walk(en,"",files)}}else files.push(...e.dataTransfer.files);
    ingest(files)};
  document.getElementById("pickF").onchange=e=>ingest([...e.target.files]);
  document.getElementById("pickD").onchange=e=>ingest([...e.target.files]);
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{S.fileId=b.dataset.up;renderView()});
  const f=curFile();if(!f||f.sector!=="upload")return;
  document.getElementById("upSave").onclick=()=>{f.name=val("upName")||f.name;const t=document.getElementById("upText");if(t)f.upload.text=t.value;touch(f);toast("Saved");renderView()};
  document.getElementById("upDel").onclick=()=>confirmBox(`Delete “${f.name}”?`,()=>{biz().files=biz().files.filter(x=>x!==f);S.fileId=null;persist();renderView()});
}
function walk(entry,path,out){return new Promise(res=>{
  if(entry.isFile)entry.file(f=>{f._path=path+f.name;out.push(f);res()},()=>res());
  else if(entry.isDirectory){const r=entry.createReader();const all=[];const read=()=>r.readEntries(async es=>{if(!es.length){for(const x of all)await walk(x,path+entry.name+"/",out);res()}else{all.push(...es);read()}},()=>res());read()}
  else res()})}
const TEXTY=/^(text\/|application\/(json|xml|csv))|\.(txt|md|csv|json|xml|html?|log)$/i;
async function ingest(files){
  let n=0,skipped=0;
  for(const file of files){
    if(file.size>2*1024*1024){skipped++;continue}
    const isText=TEXTY.test(file.type)||TEXTY.test(file.name);
    const content=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);isText?fr.readAsText(file):fr.readAsDataURL(file)});
    if(content==null){skipped++;continue}
    const t=now(),name=(file._path||file.webkitRelativePath||file.name);
    const f={id:uid(),sector:"upload",name:name.replace(/\.[^/.]+$/,""),created:t,updated:t,upload:{fileName:name,mime:file.type||"",size:file.size,...(isText?{text:content}:{dataUrl:content})}};
    biz().files.push(f);S.fileId=f.id;n++;
  }
  persist();toast(`Uploaded ${n} file${n===1?"":"s"}${skipped?`, skipped ${skipped} over 2 MB or unreadable`:""}.`);S.view="upload";renderView();
}

function bindAdmin(){
  document.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>{const x=DB.businesses[b.dataset.lock];x.locked=!x.locked;persist();toast(`${x.name} ${x.locked?"locked":"unlocked"}`);renderView()});
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{const x=DB.businesses[b.dataset.reset];

  document.getElementById("admPw").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("admNew").value;DB.admin.salt=uid();DB.admin.hash=await hash(pw,DB.admin.salt);persist();e.target.reset();toast("Admin password changed")};
}

/* ---------------- Arrow agent ---------------- */
function say(html){const r=document.getElementById("reply");if(r)r.innerHTML=`<span class="tag">ARROW AGENT</span> &nbsp;${html}`}
const KINDWORD={asset:"asset",assets:"asset",liability:"liability",liabilities:"liability",income:"income",incomes:"income",revenue:"income",profit:"income",profits:"income",expense:"expense",expenses:"expense",cost:"expense",costs:"expense"};
const kindIn=t=>{for(const w of t.split(/[^a-z]+/))if(KINDWORD[w])return KINDWORD[w];return null};
const titleCase=s=>s.trim().replace(/^["'“]|["'”]$/g,"").replace(/\s+/g," ").replace(/^./,c=>c.toUpperCase());
function needCalc(){const f=curFile();if(!f||f.sector!=="calc"){say("Open a calculation file first, for example “open a new calculation file called assets”.");return null}return f}
function runCommand(raw){
  const cmd=raw.trim();if(!cmd)return;const t=cmd.toLowerCase();let m;
  // new file
  if((m=cmd.match(/(?:open|create|start|make)\s+(?:up\s+)?(?:a\s+)?new\s+(?:(word|words|note|notes|calculation|calculations|calc|number)\s+)?file\s+(?:called|named|name)?\s*(.+)$/i))){
    let rest=m[2],first=null;const tm=rest.match(/^(.*?)(?:[,.]?\s+(?:and\s+)?(?:on\s+the\s+first\s+page\s+)?(?:write|with|put)\s+(.+?)\s+as\s+(?:the\s+)?title.*)$/i);
    if(tm){rest=tm[1];first=tm[2]}
    const word=(m[1]||"").toLowerCase();
    const sector=/calc|number/.test(word)?"calc":/word|note/.test(word)?"words":(/profit|asset|liabilit|expense|income|sales|budget|cost|money|account/.test(rest.toLowerCase())?"calc":"words");
    const name=titleCase(rest);
    if(!first){askTitle(`First page of “${name}”`,"Every page needs a title.",tt=>{createFile(sector,name,tt);renderApp();say(`Opened new ${sector==="calc"?"calculation":"word"} file <b>${esc(name)}</b> with page <b>${esc(tt)}</b>.`)});say(`What's the title of the first page of <b>${esc(name)}</b>?`);return}
    createFile(sector,name,titleCase(first));renderApp();say(`Opened new ${sector==="calc"?"calculation":"word"} file <b>${esc(name)}</b> with page <b>${esc(titleCase(first))}</b>.`);return;
  }
  // write title on page
  if((m=cmd.match(/(?:on\s+the\s+(?:first|this|current)\s+page\s+)?(?:write|put|set)\s+(.+?)\s+as\s+(?:the\s+)?title/i))){
    const f=curFile(),p=curPage();if(!p){say("Open a file first.");return}
    p.title=titleCase(m[1]);touch(f,p);renderView();say(`Page title set to <b>${esc(p.title)}</b>.`);return;
  }
  // new page
  if((m=cmd.match(/(?:new|add|another)\s+page(?:\s+(?:called|named|titled|title))?\s*(.*)$/i))){
    const f=curFile();if(!f||f.sector==="upload"){say("Open a word or calculation file first.");return}
    const tt=titleCase(m[1]||"");if(!tt){askTitle("New page","Every page needs a title.",x=>{addPage(f,x);say(`Added page <b>${esc(x)}</b>.`)});say("What's the title of the new page?");return}
    addPage(f,tt);say(`Added page <b>${esc(tt)}</b> to ${esc(f.name)}.`);return;
  }
  // open existing file
  if((m=cmd.match(/^(?:open|show|go to)\s+(?:the\s+)?(?:file\s+)?(?:called\s+)?(.+)$/i))&&!/\bnew\b/i.test(cmd)){
    const q=m[1].toLowerCase().trim();
    const sec={words:"words",word:"words",calculations:"calc",calculation:"calc",upload:"upload",uploads:"upload",dashboard:"dashboard"}[q.replace(/\s*(sector|section|page)$/,"")];
    if(sec){if(sec==="dashboard"||sec==="upload")S.view=sec;else{S.view="records";S.sector=sec;S.fileId=null}renderApp();say(`Opened ${esc(m[1])}.`);return}
    const f=biz().files.find(x=>x.name.toLowerCase()===q)||biz().files.find(x=>x.name.toLowerCase().includes(q));
    if(f){openFile(f.id);say(`Opened <b>${esc(f.name)}</b>.`);return}
  }
  // add a line: "add real estate 5000 as asset" / "real estate made 5000"
  if((m=cmd.match(/^(?:add|record|enter|put)?\s*(.+?)\s+(?:made|makes|earned|cost|costs|is|was|worth|of|=|for)?\s*\$?(-?[\d,]+(?:\.\d+)?)\s*(?:k\b)?\s*(?:as\s+(?:an?\s+)?|to\s+)?([a-z ]*)$/i))&&!/^(total|sum|subtract|minus|graph|chart|open|show|go|new|write|save)/i.test(t)){
    const f=needCalc();if(!f)return;const p=curPage();
    let amt=parseFloat(m[2].replace(/,/g,""));if(/\d\s*k\b/i.test(cmd))amt*=1000;
    let label=m[1].replace(/^(the|a|an)\s+/i,"").replace(/\s+(made|makes|earned|cost|costs|is|was|worth)$/i,"");
    const kind=kindIn(m[3]||"")||kindIn(label.toLowerCase())||(/made|earned|worth/i.test(cmd)?"asset":"asset");
    p.rows.push({id:uid(),label:titleCase(label),amount:amt,kind});touch(f,p);renderView();
    say(`Added <b>${esc(titleCase(label))}</b> ${money(amt)} as ${kind}. Page total is now <b>${money(sums(p).all)}</b>.`);return;
  }
  // subtract
  if((m=t.match(/subtract\s+(?:the\s+)?(?:money\s+(?:by|from|of)\s+(?:the\s+)?)?(\w+).*?from\s+(?:the\s+)?(\w+)/))||(m=t.match(/(\w+)\s+(?:minus|less)\s+(\w+)/))){
    const f=needCalc();if(!f)return;const p=curPage(),s=sums(p);
    let a,b;if(/subtract/.test(t)){a=kindIn(m[2]);b=kindIn(m[1])}else{a=kindIn(m[1]);b=kindIn(m[2])}
    if(!a||!b){say("Say which totals to use, for example “subtract liabilities from assets”.");return}
    const r=s[a]-s[b];say(`${cap(pl(a))} ${money(s[a])} − ${pl(b)} ${money(s[b])} = <b>${money(r)}</b>.`);return;
  }
  // totals
  if(/\b(total|sum|add up|add the|how much)\b/.test(t)){
    const f=needCalc();if(!f)return;const p=curPage(),s=sums(p),k=kindIn(t);
    if(k){say(`Total ${pl(k)} on “${esc(p.title)}”: <b>${money(s[k])}</b>.`);return}
    say(`Total of everything on “${esc(p.title)}”: <b>${money(s.all)}</b>.`);return;
  }
  // graph
  if(/\b(graph|chart|plot|pie)\b/.test(t)){
    const f=needCalc();if(!f)return;const p=curPage();
    const order=[];t.split(/[^a-z]+/).forEach(w=>{const k=KINDWORD[w];if(k&&!order.includes(k))order.push(k)});
    let series=order.length?order:["asset","liability"];
    if(/\bnet\b|difference|outcome|balance/.test(t)&&series.includes("asset")&&series.includes("liability"))series=[...series,"net"];
    if(/outcome/.test(t)&&!series.includes("net"))series.push("net");
    const title=series.filter(x=>x!=="net").map(x=>cap(pl(x))).join(" vs ")+(series.includes("net")?" and net outcome":"");
    p.charts=p.charts||[];p.charts.push({type:/\bpie\b/.test(t)?"pie":"bar",series,title,created:now()});touch(f,p);renderView();
    say(`Made a graph: <b>${esc(title)}</b>. It updates as the page changes.`);return;
  }
  // write text on word page
  if((m=cmd.match(/^(?:write|note|add note|add a note)\s*:?\s+(.+)$/i))){
    const f=curFile(),p=curPage();if(!f||f.sector!=="words"){say("Open a word file first.");return}
    p.content=(p.content?p.content.replace(/\s*$/,"")+"\n":"")+m[1];touch(f,p);renderView();say("Added to the page.");return;
  }
  if(/^save\b/.test(t)){const f=curFile();if(f){touch(f,curPage());say(`Saved <b>${esc(f.name)}</b>. Arrow also saves as you type.`)}else say("Everything is saved automatically.");return}
  askClaude(cmd);
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const pl=k=>({asset:"assets",liability:"liabilities",income:"income",expense:"expenses",other:"other"}[k]);

/* Commands the built-in rules don't understand go to Claude, when the viewer allows it */
async function askClaude(cmd){
  const sample=window.claude?.use?await window.claude.use("sample").catch(()=>null):null;
  if(!sample){say(`I didn't understand “${esc(cmd)}”. Try “open a new file called profits”, “add car 3000 as asset”, “total assets” or “graph liabilities over assets”.`);return}
  say("Thinking…");
  const f=curFile(),p=curPage();
  const ctx={openFile:f?{name:f.name,sector:f.sector,page:p?.title,rows:p?.rows,text:p?.content?.slice(0,1500)}:null,files:biz().files.map(x=>({name:x.name,sector:x.sector}))};
  try{
    const out=await sample.json(`You are the Arrow agent inside a business record-keeping app. Translate the user's command into ONE simpler command from this list, or answer a question about the open page.
Commands: "open a new calculation file called NAME and write TITLE as the title" | "open a new word file called NAME and write TITLE as the title" | "new page called TITLE" | "open NAME" | "add LABEL AMOUNT as asset|liability|income|expense" | "total KIND" | "subtract KIND from KIND" | "graph KIND over KIND" | "write TEXT".
Context: ${JSON.stringify(ctx)}
User command: ${cmd}
Reply as JSON: {"commands":["..."]} to run commands (in order), or {"answer":"..."} to answer.`,{modelTier:"quick"});
    if(out?.commands?.length){for(const c of out.commands.slice(0,6))runCommandNoFallback(c);return}
    if(out?.answer){say(esc(out.answer));return}
    say("I couldn't work that out. Try a shorter command.");
  }catch(e){say(e?.code==="not_granted"?`I didn't understand “${esc(cmd)}”. Allow Arrow to ask Claude for help with longer commands, or try a simpler one.`:"I couldn't reach Claude just now. Try a simpler command.")}
}
function runCommandNoFallback(c){const orig=askClaude;askClaude=x=>say(`I couldn't run “${esc(x)}”.`);try{runCommand(c)}finally{askClaude=orig}}

/* voice */
let rec=null;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,btn=document.getElementById("mic");
  if(rec){rec.stop();return}
  if(!SR){say("Voice commands need Chrome, Edge or Safari. You can type the command instead.");return}
  rec=new SR();rec.lang=navigator.language||"en-US";rec.interimResults=true;
  btn.classList.add("on");say("Listening…");
  rec.onresult=e=>{const tx=[...e.results].map(r=>r[0].transcript).join("");document.getElementById("cmdIn").value=tx;if(e.results[e.results.length-1].isFinal){runCommand(tx);document.getElementById("cmdIn").value=""}};
  rec.onerror=e=>say(e.error==="not-allowed"||e.error==="service-not-allowed"?"Microphone access is blocked in this preview. Voice will work once Arrow runs as its own website. Type the command for now.":"I didn't catch that. Try again or type it.");
  rec.onend=()=>{btn.classList.remove("on");rec=null};
  try{rec.start()}catch(e){btn.classList.remove("on");rec=null;say("Couldn't start the microphone. Type the command instead.")}
}
